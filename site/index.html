<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ימי הולדת במשפחה</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-box">
      <svg class="balloons" viewBox="0 0 340 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="20" cy="15" r="3" fill="#e3b23c"/>
        <circle cx="300" cy="25" r="3" fill="#c0577b"/>
        <circle cx="60" cy="100" r="2.5" fill="#c0577b"/>
        <circle cx="280" cy="95" r="2.5" fill="#e3b23c"/>
        <rect x="148" y="8" width="5" height="5" fill="#f3d7e2" transform="rotate(20 150 10)"/>
        <rect x="188" y="98" width="5" height="5" fill="#e3b23c" transform="rotate(-15 190 100)"/>
        <path d="M110 60 Q115 85 170 100" stroke="#c9a9a9" stroke-width="1.5" fill="none"/>
        <path d="M170 55 Q170 80 170 100" stroke="#c9a9a9" stroke-width="1.5" fill="none"/>
        <path d="M230 60 Q225 85 170 100" stroke="#c9a9a9" stroke-width="1.5" fill="none"/>
        <ellipse cx="110" cy="45" rx="26" ry="32" fill="#c0577b"/>
        <ellipse cx="170" cy="38" rx="28" ry="34" fill="#e3b23c"/>
        <ellipse cx="230" cy="45" rx="26" ry="32" fill="#f3a6c0"/>
        <ellipse cx="101" cy="34" rx="7" ry="10" fill="#ffffff" opacity="0.35"/>
        <ellipse cx="161" cy="27" rx="7" ry="10" fill="#ffffff" opacity="0.35"/>
        <ellipse cx="221" cy="34" rx="7" ry="10" fill="#ffffff" opacity="0.35"/>
      </svg>
      <h1>ימי הולדת במשפחה</h1>
      <p>האתר הזה פרטי למשפחה. הזינו את הסיסמה כדי להיכנס.</p>
      <input id="password-input" type="password" placeholder="סיסמה" />
      <button id="unlock-button">כניסה</button>
      <p id="gate-error" class="error"></p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header>
      <svg class="balloons" viewBox="0 0 340 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="20" cy="15" r="3" fill="#e3b23c"/>
        <circle cx="300" cy="25" r="3" fill="#c0577b"/>
        <circle cx="60" cy="100" r="2.5" fill="#c0577b"/>
        <circle cx="280" cy="95" r="2.5" fill="#e3b23c"/>
        <rect x="148" y="8" width="5" height="5" fill="#f3d7e2" transform="rotate(20 150 10)"/>
        <rect x="188" y="98" width="5" height="5" fill="#e3b23c" transform="rotate(-15 190 100)"/>
        <path d="M110 60 Q115 85 170 100" stroke="#c9a9a9" stroke-width="1.5" fill="none"/>
        <path d="M170 55 Q170 80 170 100" stroke="#c9a9a9" stroke-width="1.5" fill="none"/>
        <path d="M230 60 Q225 85 170 100" stroke="#c9a9a9" stroke-width="1.5" fill="none"/>
        <ellipse cx="110" cy="45" rx="26" ry="32" fill="#c0577b"/>
        <ellipse cx="170" cy="38" rx="28" ry="34" fill="#e3b23c"/>
        <ellipse cx="230" cy="45" rx="26" ry="32" fill="#f3a6c0"/>
        <ellipse cx="101" cy="34" rx="7" ry="10" fill="#ffffff" opacity="0.35"/>
        <ellipse cx="161" cy="27" rx="7" ry="10" fill="#ffffff" opacity="0.35"/>
        <ellipse cx="221" cy="34" rx="7" ry="10" fill="#ffffff" opacity="0.35"/>
      </svg>
      <h1>ימי הולדת במשפחה</h1>
      <div class="view-toggle">
        <button id="view-date" class="toggle-btn active">לפי תאריך</button>
        <button id="view-family" class="toggle-btn">לפי משפחה</button>
      </div>
    </header>
    <main id="cards" class="cards"></main>
    <footer>
      <p id="updated-at"></p>
    </footer>
  </div>

  <div id="greeting-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <button id="modal-close" class="modal-close">&times;</button>
      <h2 id="modal-title"></h2>
      <p class="modal-sub">הברכה תישלח למייל המשפחתי המשויך</p>
      <textarea id="greeting-text" rows="5" placeholder="כתבו כאן ברכה חמה..."></textarea>
      <button id="greeting-send" class="send-btn">שליחה</button>
      <p id="greeting-status"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
